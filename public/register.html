<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · AI Based Smart Interview</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0c0b1a 0%, #1a1a2f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 3D floating shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(124, 92, 255, 0.15);
            filter: blur(60px);
            z-index: 0;
        }
        .shape1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            background: #7c5cff;
            opacity: 0.3;
        }
        .shape2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -50px;
            background: #ff6b9d;
            opacity: 0.2;
        }
        .shape3 {
            width: 300px;
            height: 300px;
            top: 40%;
            right: 15%;
            background: #4ecdc4;
            opacity: 0.15;
            filter: blur(70px);
        }

        /* Main glass card */
        .register-card {
            width: 500px;
            max-width: 100%;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            position: relative;
            z-index: 10;
            transition: transform 0.4s ease;
            color: white;
        }

        .register-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }

        /* Logo */
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo svg {
            width: 160px;
            height: auto;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #d9d0ff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Input fields */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 4px 20px;
            transition: all 0.3s;
        }
        .input-wrapper:hover,
        .input-wrapper:focus-within {
            border-color: #7c5cff;
            background: rgba(124, 92, 255, 0.1);
            box-shadow: 0 0 20px rgba(124, 92, 255, 0.3);
        }
        .input-wrapper i {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }
        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px 0;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }
        /* Password toggle icon */
        .toggle-password {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: 0.2s;
            margin-left: 10px;
        }
        .toggle-password:hover {
            color: #7c5cff;
        }

        /* Register button */
        .register-btn {
            width: 100%;
            background: linear-gradient(145deg, #7c5cff, #6240e0);
            border: none;
            border-radius: 60px;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin: 25px 0 20px;
            box-shadow: 0 15px 30px -10px #7c5cff;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .register-btn:hover {
            background: linear-gradient(145deg, #8a6eff, #7355f0);
            transform: scale(1.02);
            box-shadow: 0 20px 35px -8px #7c5cff;
        }

        /* Login link */
        .login-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
        }
        .login-text a {
            color: #7c5cff;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }
        .login-text a:hover {
            text-decoration: underline;
            color: #a185ff;
        }

        /* Error box */
        .error {
            margin-top: 15px;
            color: #ff6b6b;
            text-align: center;
            font-size: 0.95rem;
            background: rgba(255, 107, 107, 0.1);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.3);
            display: none;
        }
        .error.show {
            display: block;
        }

        /* Copyright footer */
        .copyright {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            z-index: 1000;
            pointer-events: none;
        }

        @media (max-width: 500px) {
            .register-card { padding: 40px 25px; }
            h2 { font-size: 1.8rem; }
            .logo svg { width: 120px; }
        }
    </style>
</head>
<body>
    <!-- Background shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <!-- Register Card -->
    <div class="register-card" id="registerCard">
        <div class="logo">
            <svg width="160" height="50" viewBox="0 0 180 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="10" width="40" height="40" rx="12" fill="#7c5cff" stroke="currentColor" stroke-width="2"/>
                <circle cx="30" cy="25" r="5" fill="white"/>
                <circle cx="50" cy="25" r="5" fill="white"/>
                <circle cx="30" cy="25" r="2" fill="#333"/>
                <circle cx="50" cy="25" r="2" fill="#333"/>
                <path d="M35 35 Q40 42, 45 35" stroke="white" stroke-width="3" fill="none"/>
                <line x1="10" y1="20" x2="25" y2="20" stroke="#7c5cff" stroke-width="2" stroke-dasharray="4 2"/>
                <line x1="10" y1="30" x2="25" y2="30" stroke="#7c5cff" stroke-width="2" stroke-dasharray="4 2"/>
                <line x1="55" y1="20" x2="70" y2="20" stroke="#7c5cff" stroke-width="2" stroke-dasharray="4 2"/>
                <line x1="55" y1="30" x2="70" y2="30" stroke="#7c5cff" stroke-width="2" stroke-dasharray="4 2"/>
                <text x="80" y="35" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="currentColor">AI Smart</text>
            </svg>
        </div>
        <h2>Create Account</h2>
        <div class="subtitle">Start your interview preparation journey</div>

        <!-- Name field -->
        <div class="input-group">
            <label>Full Name</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="name" placeholder="John Doe">
            </div>
        </div>

        <!-- Email field -->
        <div class="input-group">
            <label>Email</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
        </div>

        <!-- Password field with toggle -->
        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••">
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
        </div>

        <!-- Confirm Password field with toggle -->
        <div class="input-group">
            <label>Confirm Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="••••••••">
                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
            </div>
        </div>

        <!-- Register button -->
        <button class="register-btn" onclick="register()">
            <span>Register</span>
            <i class="fas fa-arrow-right"></i>
        </button>

        <!-- Error container -->
        <div class="error" id="errorBox"></div>

        <!-- Login link -->
        <div class="login-text">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>

    <!-- Copyright footer -->
    <div class="copyright">
        © 2025 AI Based Smart Interview. All rights reserved.
    </div>

    <script>
        const BASE_URL = window.location.origin;

        // GSAP entrance animation
        gsap.from("#registerCard", {
            duration: 1,
            y: 40,
            opacity: 0,
            ease: "power3.out"
        });

        // Toggle password visibility
        function togglePassword(fieldId, icon) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // Register function
        async function register() {
            const errorBox = document.getElementById("errorBox");
            errorBox.innerText = "";
            errorBox.classList.remove("show");

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();

            if (!name || !email || !password || !confirmPassword) {
                errorBox.innerText = "Please fill in all fields.";
                errorBox.classList.add("show");
                return;
            }

            if (password !== confirmPassword) {
                errorBox.innerText = "Passwords do not match.";
                errorBox.classList.add("show");
                return;
            }

            if (password.length < 6) {
                errorBox.innerText = "Password must be at least 6 characters.";
                errorBox.classList.add("show");
                return;
            }

            try {
                const res = await fetch(BASE_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Registration successful! Please log in.");
                    window.location.href = "login.html";
                } else {
                    errorBox.innerText = data.message || "Registration failed.";
                    errorBox.classList.add("show");
                }
            } catch (err) {
                errorBox.innerText = "Server not responding. Please try again.";
                errorBox.classList.add("show");
            }
        }
    </script>
</body>
</html>
