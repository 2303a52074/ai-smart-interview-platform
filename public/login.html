<!DOCTYPE html>
<html>
<head>
    <title>Login - AI Based Smart Interview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background:#0f0f18;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:'Inter',sans-serif;
            color:white;
        }

        .card{
            width:350px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(20px);
        }

        h2{
            margin-bottom:25px;
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border-radius:10px;
            border:none;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            border-radius:10px;
            border:none;
            background:linear-gradient(90deg,#7c5cff,#a66cff);
            color:white;
            cursor:pointer;
        }

        p{
            margin-top:15px;
            text-align:center;
        }

        a{
            color:#a66cff;
        }

        .error{
            margin-top:10px;
            color:#ff6b6b;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="error" id="errorBox"></div>

    <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
    const BASE_URL = "https://ai-smart-interview-platform-1.onrender.com";
async function login(){

    const errorBox = document.getElementById("errorBox");
    errorBox.innerText = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!email || !password){
        errorBox.innerText = "Please enter email and password.";
        return;
    }

    try{

        const res = await fetch(BASE_URL + '/api/auth/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email,password})
        });

        const data = await res.json();

        if(res.ok){
            localStorage.setItem("token",data.token);
            window.location.href="dashboard.html";
        }else{
            errorBox.innerText = data.message || "Login failed.";
        }

    }catch(err){
        errorBox.innerText = "Server not responding.";
    }
}
</script>

</body>
</html>
