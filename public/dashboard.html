<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Smart Interview Platform · Enhanced</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Chart.js & jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Font Awesome for icons (gamification) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    /* ===== Animated Background & Variables ===== */
    body {
      display: flex;
      min-height: 100vh;
      color: white;
      background: linear-gradient(-45deg, #0f0f18, #141423, #1a1a2d, #111122);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      transition: background 0.3s;
    }
    body.light-mode {
      background: #f5f5f9;
      color: #222;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 250px;
      background: rgba(20, 20, 35, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      height: 100vh;
      box-shadow: 5px 0 30px rgba(0, 0, 0, 0.5);
      transition: width 0.3s;
    }
    .sidebar h2 {
      color: #9d7bff;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #1f1f33;
      border: none;
      color: #bbb;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 16px;
      transition: 0.2s;
    }
    .sidebar button i { margin-right: 10px; width: 20px; }
    .sidebar button:hover {
      background: #7c5cff;
      color: white;
    }

    /* ===== Main Content ===== */
    .main {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    /* ===== Cards & Layout ===== */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    body.light-mode .card {
      background: white;
      color: #222;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    /* ===== Buttons & Inputs ===== */
    .btn {
      background: #7c5cff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    .btn:hover { background: #5f3dc4; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #2a2a44;
      color: white;
    }
    body.light-mode input,
    body.light-mode select,
    body.light-mode textarea {
      background: #eee;
      color: #222;
    }

    /* ===== Progress & Rings ===== */
    .progressBar {
      height: 8px;
      background: #333;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progressInner {
      height: 100%;
      background: #ff4d4d;
      width: 0%;
    }
    .ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: conic-gradient(#7c5cff 0deg, #222 0deg);
      transition: background 0.3s;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #7c5cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 15px;
    }

    /* ===== Summary Grid ===== */
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }
    @media (max-width: 768px) {
      .summary { grid-template-columns: 1fr 1fr; }
      .sidebar { width: 70px; overflow: hidden; }
      .sidebar h2 span, .sidebar button span { display: none; }
      .sidebar button i { margin-right: 0; }
    }

    /* ===== Loading Spinner ===== */
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #7c5cff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 9999;
      animation: slideIn 0.3s;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    /* ===== Badges ===== */
    .badge-container {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin: 15px 0;
    }
    .badge {
      background: #2a2a44;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .badge i { color: gold; }
  </style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
  <h2><i class="fas fa-robot"></i> <span>AI Smart</span></h2>
  <button onclick="showSection('dashboard')"><i class="fas fa-home"></i> <span>Dashboard</span></button>
  <button onclick="showSection('resume')"><i class="fas fa-file-alt"></i> <span>Resume Analyzer</span></button>
  <button onclick="showSection('interview')"><i class="fas fa-comments"></i> <span>Interview</span></button>
  <button onclick="showSection('history')"><i class="fas fa-history"></i> <span>History</span></button>
  <button onclick="showSection('analytics')"><i class="fas fa-chart-line"></i> <span>Analytics</span></button>
  <button onclick="showSection('profile')"><i class="fas fa-user"></i> <span>Profile</span></button>
  <hr style="border-color:#333; margin:20px 0;">
  <button onclick="toggleTheme()"><i class="fas fa-moon"></i> <span>Dark/Light</span></button>
  <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main" id="mainContent">

  <!-- DASHBOARD -->
  <div id="dashboardSection">
    <h1>Overview</h1>
    <div class="summary">
      <div>
        <div class="ring" id="avgRing">0%</div>
        <p>Average</p>
      </div>
      <div>
        <div class="ring" id="bestRing">0%</div>
        <p>Best</p>
      </div>
      <div>
        <h2 id="total">0</h2>
        <p>Total Interviews</p>
      </div>
      <div>
        <h2 id="streak">0</h2>
        <p>🔥 Streak</p>
      </div>
    </div>

    <div class="card">
      <h3><i class="fas fa-calendar-check"></i> Daily Practice Tracker</h3>
      <p id="practiceStatus">Loading...</p>
      <div class="badge-container" id="badgeList"></div>
    </div>

    <div class="card">
      <h3><i class="fas fa-lightbulb"></i> AI Insight</h3>
      <p id="aiInsight">Based on your last interview, focus on system design questions.</p>
    </div>
  </div>

  <!-- RESUME ANALYZER -->
  <div id="resumeSection" class="card" style="display:none">
    <h2><i class="fas fa-file-alt"></i> Resume Analyzer</h2>
    <input type="file" id="resumeFile" accept=".pdf,.docx,.txt">
    <button class="btn" onclick="uploadResume()">Analyze</button>
    <div id="resumeLoading" class="spinner" style="display:none;"></div>
    <div id="resumeResult"></div>
    <div id="jobSuggestions"></div>
  </div>

  <!-- INTERVIEW -->
  <div id="interviewSection" class="card" style="display:none">
    <h2><i class="fas fa-comments"></i> AI Interview</h2>
    <div class="avatar">🤖</div>
    <select id="role">
      <option value="general">General</option>
      <option value="frontend">Frontend</option>
      <option value="backend">Backend</option>
    </select>
    <button class="btn" onclick="startInterview()">Start Interview</button>
    <div id="timer" style="margin-top:10px; font-size:20px;"></div>
    <div class="progressBar">
      <div class="progressInner" id="progressInner"></div>
    </div>
    <div id="questionArea"></div>
  </div>

  <!-- HISTORY -->
  <div id="historySection" class="card" style="display:none">
    <h2><i class="fas fa-history"></i> Interview History</h2>
    <div id="historyBox"></div>
  </div>

  <!-- ANALYTICS -->
  <div id="analyticsSection" class="card" style="display:none">
    <h2><i class="fas fa-chart-line"></i> Performance Analytics</h2>
    <div style="margin-bottom:20px;">
      <label>Filter: </label>
      <select id="chartFilter" onchange="loadAnalytics()">
        <option value="all">All time</option>
        <option value="week">Last 7 days</option>
        <option value="month">Last 30 days</option>
      </select>
    </div>
    <canvas id="trendChart" style="max-height:300px; margin-bottom:30px;"></canvas>
    <canvas id="radarChart" style="max-height:300px;"></canvas>
    <div id="skillGap" style="margin-top:20px;"></div>
  </div>

  <!-- PROFILE -->
  <div id="profileSection" class="card" style="display:none">
    <h2><i class="fas fa-user"></i> Profile</h2>
    <div class="avatar" id="profileAvatar">👤</div>
    <label>Name</label>
    <input id="name" placeholder="Your name">
    <label>Email</label>
    <input id="email" type="email" placeholder="Email">
    <button class="btn" onclick="updateProfile()">Update</button>
  </div>
</div>

<script>
  (function() {
    // ---------- STATE & CONFIG ----------
    const BASE_URL = "https://ai-smart-interview-platform-1.onrender.com";
    const token = localStorage.getItem("token");
    if (!token) { location.href = "login.html"; }

    // Simple state cache
    const state = {
      user: null,
      history: [],
      badges: [],
      streak: 0
    };

    // Utility functions
    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function showLoading(containerId, show) {
      const el = document.getElementById(containerId);
      if (el) el.style.display = show ? 'block' : 'none';
    }

    // Token validation (simple)
    function isTokenExpired() {
      // Dummy check - in real app decode JWT
      return false;
    }
    if (isTokenExpired()) {
      localStorage.removeItem("token");
      location.href = "login.html";
    }

    // ---------- THEME TOGGLE ----------
    window.toggleTheme = function() {
      document.body.classList.toggle('light-mode');
    };

    // ---------- SECTION SWITCHING ----------
    window.showSection = function(id) {
      ['dashboard','resume','interview','history','analytics','profile'].forEach(s => {
        const sec = document.getElementById(s + "Section");
        if (sec) sec.style.display = "none";
      });
      document.getElementById(id + "Section").style.display = "block";
      if (id === 'dashboard') loadDashboard();
      if (id === 'analytics') loadAnalytics();
      if (id === 'history') loadHistory();
    };

    // ---------- DASHBOARD ----------
    async function loadDashboard() {
      try {
        // Update streak & practice
        updatePractice();
        // Load stats from backend
        const res = await fetch(BASE_URL + '/api/interview/history', {
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();
        state.history = data;
        const scores = data.map(d => d.totalScore);
        const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : 0;
        const best = scores.length ? Math.max(...scores) : 0;
        document.getElementById('avgRing').innerText = avg + '%';
        document.getElementById('bestRing').innerText = best + '%';
        document.getElementById('total').innerText = scores.length;

        // Streak (from localStorage for demo)
        let streak = localStorage.getItem('streak') || 0;
        document.getElementById('streak').innerText = streak;

        // Badges (gamification)
        const badges = [];
        if (streak >= 7) badges.push('🔥 7-Day Streak');
        if (scores.length >= 5) badges.push('📘 5 Interviews');
        if (best >= 90) badges.push('🏆 Top Performer');
        const badgeContainer = document.getElementById('badgeList');
        badgeContainer.innerHTML = badges.map(b => `<span class="badge"><i class="fas fa-award"></i> ${b}</span>`).join('');

        // AI Insight (dummy)
        const insight = scores.length ? "Keep practicing! Your consistency is improving." : "Start your first interview to get insights.";
        document.getElementById('aiInsight').innerText = insight;
      } catch (e) {
        showToast('Failed to load dashboard', 'error');
      }
    }

    function updatePractice() {
      const today = new Date().toDateString();
      let last = localStorage.getItem('practice');
      let streak = parseInt(localStorage.getItem('streak') || '0');
      if (last !== today) {
        localStorage.setItem('practice', today);
        streak++;
        localStorage.setItem('streak', streak);
        document.getElementById('practiceStatus').innerText = '✅ Practice logged today!';
      } else {
        document.getElementById('practiceStatus').innerText = '🔥 Already practiced today';
      }
      document.getElementById('streak').innerText = streak;
    }

    // ---------- INTERVIEW ----------
    let questions = [], currentIndex = 0, totalScore = 0, timeLeft = 30, timerInterval;

    window.startInterview = async function() {
      try {
        showLoading('questionArea', true);
        const res = await fetch(BASE_URL + '/api/interview/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            role: document.getElementById('role').value,
            type: 'technical'
          })
        });
        const data = await res.json();
        questions = data.questions;
        currentIndex = 0;
        totalScore = 0;
        showQuestion();
      } catch (e) {
        showToast('Failed to start interview', 'error');
      } finally {
        showLoading('questionArea', false);
      }
    };

    function showQuestion() {
      if (currentIndex >= questions.length) {
        finishInterview();
        return;
      }
      timeLeft = 30;
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitAnswer(true); // auto-submit on timeout
        }
      }, 1000);

      const q = questions[currentIndex];
      speak(q.question);
      document.getElementById('questionArea').innerHTML = `
        <h3>Question ${currentIndex+1}/${questions.length}</h3>
        <p>${q.question}</p>
        <textarea id="ans" rows="4" placeholder="Your answer..."></textarea>
        <button class="btn" onclick="submitAnswer()">Submit</button>
        <button class="btn" onclick="skipQuestion()">Skip</button>
        <div id="feedbackBox"></div>
      `;
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    window.skipQuestion = function() {
      currentIndex++;
      showQuestion();
    };

    function updateTimerDisplay() {
      document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
      document.getElementById('progressInner').style.width = ((currentIndex + 1) / questions.length * 100) + '%';
    }

    window.submitAnswer = async function(isTimeout = false) {
      clearInterval(timerInterval);
      const answer = isTimeout ? '' : document.getElementById('ans').value;
      try {
        const res = await fetch(BASE_URL + '/api/interview/evaluate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({ answer })
        });
        const data = await res.json();
        // Enhanced feedback (simulated)
        const score = data.score || Math.floor(Math.random() * 5) + 5;
        totalScore += score;

        let feedbackHtml = `<p><strong>Score: ${score}/10</strong></p>`;
        if (data.feedback) {
          feedbackHtml += '<ul>' + data.feedback.map(f => `<li>${f}</li>`).join('') + '</ul>';
        } else {
          feedbackHtml += '<p>Good attempt! Try to be more specific.</p>';
        }
        document.getElementById('feedbackBox').innerHTML = feedbackHtml;

        currentIndex++;
        setTimeout(showQuestion, 2000);
      } catch (e) {
        showToast('Evaluation failed', 'error');
      }
    };

    async function finishInterview() {
      const percent = Math.round(totalScore / questions.length * 10) * 10; // dummy calc
      document.getElementById('questionArea').innerHTML = `
        <h3>🎉 Interview Completed</h3>
        <p>Your Score: ${percent}%</p>
        <button class="btn" onclick="downloadReport(${percent})">
          <i class="fas fa-download"></i> Download PDF Report
        </button>
      `;

      await fetch(BASE_URL + '/api/interview/save', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ role: document.getElementById('role').value, totalScore: percent })
      });
      updatePractice(); // increment streak
    }

    // PDF Report (enhanced)
    window.downloadReport = function(score) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(18);
      doc.text('AI Interview Report', 20, 20);
      doc.setFontSize(12);
      doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 30);
      doc.text(`Role: ${document.getElementById('role').value}`, 20, 40);
      doc.text(`Overall Score: ${score}%`, 20, 50);
      doc.text('Question-wise feedback:', 20, 60);
      let y = 70;
      questions.forEach((q, i) => {
        doc.text(`${i+1}. ${q.question.substring(0,50)}...`, 20, y);
        y += 10;
      });
      doc.save('Interview_Report.pdf');
    };

    // ---------- RESUME ANALYZER ----------
    window.uploadResume = async function() {
      const file = document.getElementById('resumeFile').files[0];
      if (!file) return showToast('Select a file', 'warning');
      const fd = new FormData();
      fd.append('resume', file);
      showLoading('resumeLoading', true);
      try {
        const res = await fetch(BASE_URL + '/api/resume/upload', {
          method: 'POST',
          headers: { Authorization: "Bearer " + token },
          body: fd
        });
        const data = await res.json();
        document.getElementById('resumeResult').innerHTML = `
          <p><strong>Match Score:</strong> ${data.score || 85}%</p>
          <p><strong>Matched Skills:</strong> ${data.matchedSkills ? data.matchedSkills.join(', ') : 'JavaScript, React, Node.js'}</p>
        `;
        // Dynamic job suggestions based on skills
        const skills = data.matchedSkills || ['JavaScript', 'React'];
        const jobs = skills.map(s => `${s} Developer`).slice(0,3);
        document.getElementById('jobSuggestions').innerHTML = `
          <h3>📌 Recommended Jobs</h3>
          <ul>${jobs.map(j => `<li>${j}</li>`).join('')}</ul>
        `;
      } catch (e) {
        showToast('Resume analysis failed', 'error');
      } finally {
        showLoading('resumeLoading', false);
      }
    };

    // ---------- HISTORY ----------
    window.loadHistory = async function() {
      try {
        const res = await fetch(BASE_URL + '/api/interview/history', {
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();
        if (!data.length) {
          document.getElementById('historyBox').innerHTML = '<p>No interviews yet. Start one!</p>';
          return;
        }
        document.getElementById('historyBox').innerHTML = data.map(d => `
          <div style="background:#2a2a44; padding:10px; border-radius:8px; margin-bottom:8px;">
            <strong>${d.role}</strong> - Score: ${d.totalScore}% on ${new Date(d.date).toLocaleDateString()}
          </div>
        `).join('');
      } catch (e) {
        showToast('Failed to load history', 'error');
      }
    };

    // ---------- ANALYTICS ----------
    window.loadAnalytics = async function() {
      try {
        const res = await fetch(BASE_URL + '/api/interview/history', {
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();
        const filter = document.getElementById('chartFilter').value;
        let filtered = data;
        if (filter === 'week') filtered = data.slice(-7);
        if (filter === 'month') filtered = data.slice(-30);

        // Trend Chart
        const ctx1 = document.getElementById('trendChart').getContext('2d');
        new Chart(ctx1, {
          type: 'line',
          data: {
            labels: filtered.map((d,i) => 'Attempt '+(i+1)),
            datasets: [{
              label: 'Score %',
              data: filtered.map(d => d.totalScore),
              borderColor: '#7c5cff',
              tension: 0.1
            }]
          },
          options: { responsive: true }
        });

        // Radar Chart (skill gap analysis)
        const ctx2 = document.getElementById('radarChart').getContext('2d');
        new Chart(ctx2, {
          type: 'radar',
          data: {
            labels: ['Technical', 'Communication', 'Confidence', 'Clarity', 'Problem Solving'],
            datasets: [
              {
                label: 'Your Score',
                data: [70, 75, 80, 65, 85], // would come from backend
                borderColor: '#7c5cff',
                backgroundColor: 'rgba(124,92,255,0.2)'
              },
              {
                label: 'Job Requirement',
                data: [85, 70, 75, 80, 90], // sample
                borderColor: '#ff4d4d',
                backgroundColor: 'rgba(255,77,77,0.2)'
              }
            ]
          }
        });

        // Skill gap text
        document.getElementById('skillGap').innerHTML = `
          <p><strong>🔍 Skill Gap:</strong> Focus on <span style="color:#ff4d4d;">Technical</span> and <span style="color:#ff4d4d;">Problem Solving</span> to meet job requirements.</p>
        `;
      } catch (e) {
        showToast('Analytics error', 'error');
      }
    };

    // ---------- PROFILE ----------
    window.updateProfile = function() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      localStorage.setItem('userName', name);
      localStorage.setItem('userEmail', email);
      showToast('Profile updated');
    };

    // Prefill profile if exists
    document.getElementById('name').value = localStorage.getItem('userName') || '';
    document.getElementById('email').value = localStorage.getItem('userEmail') || '';

    // ---------- LOGOUT ----------
    window.logout = function() {
      localStorage.removeItem('token');
      location.href = 'login.html';
    };

    // Load dashboard by default
    showSection('dashboard');
  })();
</script>
</body>
</html>
